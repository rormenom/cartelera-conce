<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartelera Concepción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg:#f2f4f6; --surface:#fff; --ink:#18212b; --muted:#5b6672; --line:#d9dee4; --accent:#c2410c;
  --tbb:#1d5fa8; --udec:#7a3fb0; --ucsc:#b42335; --free:#1f7a4d; --pina:#8a5a12; --af:#0f7c86;
  --bib:#5d6b12; --gh:#8c3f6b; --otro:#4b5563;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#11161c; --surface:#1a2129; --ink:#e8ecf0; --muted:#9aa5b1; --line:#2c3540; --accent:#f08a4b;
    --tbb:#6aa8ee; --udec:#b98be6; --ucsc:#f07282; --free:#5cc792; --pina:#e0b35c; --af:#4fc4cf;
    --bib:#b5c75a; --gh:#e08bbb; --otro:#a8b0bb; color-scheme:dark;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; }
.wrap { max-width:860px; margin:0 auto; padding:32px 16px 56px; }
header h1 { font-family:var(--display); font-weight:800; font-size:clamp(2.6rem,9vw,4.4rem); line-height:.92; margin:0; text-transform:uppercase; }
header h1 span { color:var(--accent); }
.lede { color:var(--muted); max-width:60ch; margin:12px 0 0; }
.upd { font-family:var(--mono); font-size:12px; color:var(--muted); margin:6px 0 0; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:24px 0 8px; }
.chip { font:500 13px var(--body); border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  padding:6px 12px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.chip .dot { width:9px; height:9px; border-radius:50%; background:var(--c,var(--muted)); }
.chip[aria-pressed="true"] { border-color:var(--c,var(--ink)); box-shadow:inset 0 0 0 1px var(--c,var(--ink)); }
.count { color:var(--muted); font-size:13px; margin:0 0 8px; }
.day { display:grid; grid-template-columns:74px 1fr; gap:16px; padding-block:18px; border-top:1px solid var(--line); }
.date { font-family:var(--display); line-height:.9; text-transform:uppercase; }
.date .n { font-size:2.6rem; font-weight:800; display:block; }
.date .w { font-size:1rem; font-weight:600; color:var(--muted); letter-spacing:.06em; }
.day.today .date .n { color:var(--accent); }
.events { display:grid; gap:10px; min-width:0; }
.ev { display:grid; grid-template-columns:52px 1fr; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-left:4px solid var(--c); border-radius:6px; padding:10px 14px; }
.ev .t { font-family:var(--mono); font-size:13px; padding-top:2px; color:var(--muted); }
.ev h3 { margin:0; font-size:16px; font-weight:600; line-height:1.3; }
.ev h3 a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
.ev h3 a:hover { border-color:var(--c); }
.ev .who { color:var(--muted); font-size:13.5px; }
.ev .info { min-width:0; }
.meta { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:6px; font-size:12.5px; align-items:center; }
.venue { font-weight:600; color:var(--c); text-transform:uppercase; letter-spacing:.05em; font-size:11.5px; }
.tag { color:var(--muted); }
.price { font-family:var(--mono); font-size:12px; }
.price.free { color:var(--free); font-weight:500; }
section.ongoing { margin-top:36px; }
h2 { font-family:var(--display); font-weight:800; text-transform:uppercase; font-size:1.7rem; margin:0 0 12px; }
.ex { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.ex .ev { grid-template-columns:1fr; }
.notes { margin-top:36px; color:var(--muted); font-size:13.5px; display:grid; gap:8px; max-width:70ch; }
.notes p { margin:0; }
.notes a { color:var(--ink); }
.empty { color:var(--muted); padding:24px 0; border-top:1px solid var(--line); }
@media (max-width:480px) {
  .day { grid-template-columns:1fr; gap:8px; }
  .date { display:flex; align-items:baseline; gap:8px; }
  .date .n { font-size:2rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cartelera<br><span>Concepción</span></h1>
    <p class="lede" id="lede">Teatro, música, cine y exposiciones en Concepción.</p>
    <p class="upd" id="upd"></p>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Filtrar por lugar"></div>
  <p class="count" id="count"></p>
  <main id="list"><p class="empty">Cargando cartelera…</p></main>
  <section class="ongoing">
    <h2>Exposiciones en curso</h2>
    <div class="ex" id="ex"></div>
  </section>
  <div class="notes" id="notes"></div>
</div>

<script>
// Ventana fija: hoy + los 6 días siguientes (7 días), en hora de Chile.
const DIAS = 7;
const URL_DATOS = "https://raw.githubusercontent.com/rormenom/cartelera-conce/main/cartelera.json";
const WD = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.toISOString().slice(0,10);
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const corto = s => { const d = fromIso(s); return `${d.getUTCDate()} ${MES[d.getUTCMonth()]}`; };

function hoyChile() {
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Santiago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return fromIso(p);
}

let DATA = null, state = {}, soloGratis = false;
const hoy = hoyChile();
const desde = iso(hoy);
const hasta = iso(new Date(hoy.getTime() + (DIAS-1)*86400000));

function lugar(k) { return (DATA.lugares && DATA.lugares[k]) || { nombre:k, color:"--otro" }; }

function card(e, esExpo) {
  const L = lugar(e.lugar);
  const free = /gratis/i.test(e.precio || "");
  const titulo = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.titulo)}</a>` : esc(e.titulo);
  let cuando = "";
  if (esExpo) {
    cuando = e.hasta ? `Hasta el ${corto(e.hasta)}` : (e.desde && e.desde > desde ? `Desde el ${corto(e.desde)}` : "En exhibición");
    if (e.horario) cuando += ` · ${e.horario}`;
  }
  return `<article class="ev" style="--c:var(${L.color})">
    ${esExpo ? "" : `<div class="t">${esc(e.hora) || "—"}</div>`}
    <div class="info">
      <h3>${titulo}</h3>
      ${e.detalle ? `<div class="who">${esc(e.detalle)}</div>` : ""}
      <div class="meta">
        <span class="venue">${esc(L.nombre)}</span>
        ${e.sala && e.sala !== L.nombre ? `<span class="tag">${esc(e.sala)}</span>` : ""}
        ${cuando ? `<span class="tag">${esc(cuando)}</span>` : ""}
        ${e.tipo ? `<span class="tag">${esc(e.tipo)}</span>` : ""}
        ${e.precio ? `<span class="price${free ? " free" : ""}">${esc(e.precio)}</span>` : ""}
      </div>
    </div>
  </article>`;
}

function render() {
  const ok = e => state[e.lugar] !== false && (!soloGratis || /gratis/i.test(e.precio || ""));
  const evs = (DATA.eventos || []).filter(e => e.fecha >= desde && e.fecha <= hasta && ok(e));
  const byDay = {};
  evs.forEach(e => (byDay[e.fecha] ||= []).push(e));
  const dias = Object.keys(byDay).sort();
  document.getElementById("list").innerHTML = dias.length ? dias.map(f => {
    const d = fromIso(f);
    const items = byDay[f].sort((a,b) => (a.hora || "99").localeCompare(b.hora || "99"));
    const esHoy = f === desde;
    return `<section class="day${esHoy ? " today" : ""}">
      <div class="date"><span class="n">${d.getUTCDate()}</span><span class="w">${WD[d.getUTCDay()]} ${MES[d.getUTCMonth()]}${esHoy ? " · hoy" : ""}</span></div>
      <div class="events">${items.map(e => card(e,false)).join("")}</div>
    </section>`;
  }).join("") : `<p class="empty">No hay funciones con estos filtros en los próximos ${DIAS} días.</p>`;
  document.getElementById("count").textContent =
    `${evs.length} ${evs.length === 1 ? "función" : "funciones"} en ${dias.length} ${dias.length === 1 ? "día" : "días"}`;

  const expos = (DATA.exposiciones || []).filter(x =>
    (!x.hasta || x.hasta >= desde) && (!x.desde || x.desde <= hasta) && ok(x));
  document.getElementById("ex").innerHTML = expos.map(x => card(x,true)).join("") ||
    `<p class="empty">Ninguna con estos filtros.</p>`;

  document.querySelectorAll(".chip").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.free ? soloGratis : state[b.dataset.v] !== false));
}

function chips() {
  const usados = new Set([...(DATA.eventos || []), ...(DATA.exposiciones || [])].map(e => e.lugar));
  const html = Object.entries(DATA.lugares || {}).filter(([k]) => usados.has(k)).map(([k,L]) =>
    `<button class="chip" data-v="${esc(k)}" style="--c:var(${L.color})"><span class="dot"></span>${esc(L.nombre)}</button>`
  ).join("") + `<button class="chip" data-free="1" style="--c:var(--free)"><span class="dot"></span>Solo gratis</button>`;
  const box = document.getElementById("filters");
  box.innerHTML = html;
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.free) soloGratis = !soloGratis;
    else state[b.dataset.v] = state[b.dataset.v] === false;
    render();
  }));
}

function notas() {
  const n = (DATA.notas || []).map(t => `<p>${esc(t)}</p>`).join("");
  const f = (DATA.fuentes || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nombre)}</a>`).join(", ");
  document.getElementById("notes").innerHTML = n + (f ? `<p>Fuentes: ${f}.</p>` : "");
}

document.getElementById("lede").textContent =
  `Teatro, música, cine y exposiciones en Concepción del ${corto(desde)} al ${corto(hasta)}.`;

fetch(URL_DATOS + "?t=" + Date.now(), { cache:"no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    if (d.actualizado) document.getElementById("upd").textContent = `Datos actualizados el ${corto(d.actualizado)} ${d.actualizado.slice(0,4)}`;
    chips(); notas(); render();
  })
  .catch(() => {
    document.getElementById("list").innerHTML = `<p class="empty">No se pudo cargar la cartelera. Intenta recargar la página.</p>`;
  });
</script>
</body>
</html>
